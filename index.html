<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사라진 인천을 찾아서 · 부평·계양 문화유산 탐정단</title>
<meta name="description" content="초등 4학년 인천형 세계시민교육 비주얼 노벨: 부평·계양의 사라져 가는 문화유산을 읽걷쓰 AI 리리와 함께 조사해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rotate">📱 휴대폰은 <b>가로</b>로 돌려 주세요!</div>

<div id="stage">
  <div id="bgwrap"><img id="bgA" alt=""><img id="bgB" alt=""></div>
  <div id="chars"></div>

  <div id="hud" class="hidden">
    <div class="pill" id="hudPlace">📍 탐정단 본부</div>
    <div class="pill step" id="hudStep">읽걷쓰 4P</div>
    <div class="spacer"></div>
    <div class="pill" id="hudScore">⭐ 0점</div>
    <button class="pill btn" id="btnNote">📓 탐정 수첩 <span id="noteCount">0</span></button>
    <button class="pill btn" id="btnMap">🗺️ 지도</button>
    <button class="pill btn" id="btnSound" title="소리 켜기/끄기">🔊</button>
  </div>

  <div id="placecard"></div>

  <div id="textbox" class="hidden">
    <div id="namebox"></div>
    <div id="text"></div>
    <div id="ctc">▼</div>
  </div>

  <div id="overlay"></div>
  <div id="toast"></div>
</div>

<div id="print-area"></div>

<script src="game.js"></script>
<script src="story.js"></script>
</body>
</html>
